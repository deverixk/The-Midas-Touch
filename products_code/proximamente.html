<!DOCTYPE html>
<html lang="es">
<head>
    <!--Config-->
    <title>Próximamente - The Midas Touch</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="author" content="Erick Vazquez">
    <meta name="description" content="Nuevos productos NFC próximamente disponibles.">
    <meta name="keywords" content="NFC, próximamente, nuevos productos">

    <!--Iconos-->
    <link rel="icon" type="image/png" href="../assets/images/icons/logo_fullgold.webp">
    <link rel="apple-touch-icon" href="../assets/images/icons/minimalist-ico.webp">
    <meta name="msapplication-TileImage" content="../assets/images/icons/minimalist-ico.png">
    <meta name="msapplication-TileColor" content="#000000">

    <!-- Colores de la barra -->
    <meta name="theme-color" content="#FFCD00">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!--Fuentes-->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <!--Estilos-->
    <link rel="stylesheet" href="../styles_desktop.css">
    <link rel="stylesheet" href="../styles_movil.css">
    
    <style>
        /* Estilos específicos para página de próximamente */
        .coming-soon-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .coming-soon-icon {
            font-size: 8rem;
            margin-bottom: 2rem;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .coming-soon-title {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: var(--gold);
            margin-bottom: 1.5rem;
            letter-spacing: 0.2rem;
        }
        
        .coming-soon-description {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: rgba(250, 250, 250, 0.7);
            max-width: 600px;
            line-height: 1.8;
            margin-bottom: 3rem;
        }
        
        .back-to-products {
            display: inline-block;
            padding: 1.2rem 3rem;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }
        
        .back-to-products:hover {
            background: var(--gold);
            color: var(--black);
        }
        
        @media (max-width: 768px) {
            .coming-soon-icon {
                font-size: 5rem;
            }
            
            .coming-soon-title {
                font-size: 2.5rem;
            }
            
            .coming-soon-description {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <!-- Header Fijo -->
    <header class="product-header">
        <div class="product-header-left">
            <a href="../main.html" class="back-button-text">
                ← Inicio
            </a>
        </div>
        <div class="product-header-logo">
            <img src="../assets/images/logos/Minimalist.webp" alt="The Midas Touch">
        </div>
        <div class="product-header-right">
            <span class="header-section-label">Productos</span>
        </div>
    </header>

    <!-- Tabs de Categorías - STICKY -->
    <nav class="category-tabs">
        <div class="tabs-container">
            <a href="tarjeta-nfc.html" class="tab-item">Premium</a>
            <a href="tag-nfc.html" class="tab-item">Smart</a>
            <a href="llavero-disco.html" class="tab-item">Gift</a>
            <a href="card-holder.html" class="tab-item">Business</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="product-page">
        <div class="product-container">
            
            <div class="coming-soon-container">
                <div class="coming-soon-icon">✨</div>
                
                <h1 class="coming-soon-title">Próximamente</h1>
                
                <p class="coming-soon-description">
                    Estamos trabajando en nuevos productos increíbles con tecnología NFC. 
                    Muy pronto revelaremos innovaciones que transformarán la forma en que 
                    compartes información y conectas con el mundo.
                </p>
                
                <a href="../main.html#productos" class="back-to-products">
                    Ver Productos Disponibles
                </a>
            </div>

        </div>
    </main>

    <!--Scripts-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../product-page.js"></script>
</body>
</html>
